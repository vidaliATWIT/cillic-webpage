
<head>
    <style>html{visibility: hidden;opacity:0;}</style>
<div id="header-container"></div>
	<script>
		fetch('includes/header.html')
			.then(response => response.text())
			.then(data => {
        const container = document.getElementById('header-container');
        container.innerHTML = data;
        
    });
	</script>
</head>

<body>
	<div id="content">
		<div id="navigation-container"></div>
		<script>
		fetch('includes/navigation.html')
			.then(response => response.text())
			.then(data => {
				const container = document.getElementById('navigation-container');
				container.innerHTML = data;
				
			});
		</script>

		<h2>News</h2>
		<p>Information and redirects for most recent releases</p>
		<h3><i>Metal Box Now on Windows</i></h3>
		<img id="newspic" src="images/metalbox.png">
		<p id="story">
			The Windows ports of both Metal Box and Metal Box Lite are now up. They are packaged alongside the Mac installers on their existing pages. Thanks for your patience.
		</p>



		<div id="footer-container"></div>
		<script>
			fetch('includes/footer.html')
				.then(response => response.text())
				.then(data => {
					document.getElementById('footer-container').innerHTML = data;
				});
		</script>

	</div>
</body>
</html>
